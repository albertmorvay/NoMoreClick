name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '32 16 * * 6'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: windows-2025
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      matrix:
        language: [csharp]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: '10.0.x'
          skip-lts-prepass: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: manual

      - name: Restore and audit NuGet packages
        run: dotnet restore src/NoMoreClick.sln -p:NuGetAudit=true -p:NuGetAuditMode=all

      - name: Build NoMoreClick
        run: dotnet build src/NoMoreClick.sln --configuration Release --no-restore --no-incremental -p:UseSharedCompilation=false

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
